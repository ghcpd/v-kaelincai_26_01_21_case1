[build-system]
build-backend = "hatchling.build"
requires = [
  "hatchling>=1.27",
]

[project]
name = "prettytable"
version = "3.12.0"
description = "A simple Python library for easily displaying tabular data in a visually appealing ASCII table format"
readme = "README.md"
license = "BSD-3-Clause"
maintainers = [ { name = "Hugo van Kemenade" } ]
authors = [ { name = "Luke Maurits", email = "luke@maurits.id.au" } ]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Text Processing",
  "Typing :: Typed",
]
dependencies = [
  "wcwidth",
]
optional-dependencies.tests = [
  "pytest",
  "pytest-cov",
  "pytest-lazy-fixtures",
]
optional-dependencies.dev = [
  "mypy>=1.0.0",
  "types-colorama",
]
urls.Changelog = "https://github.com/prettytable/prettytable/releases"
urls.Funding = "https://tidelift.com/subscription/pkg/pypi-prettytable?utm_source=pypi-prettytable&utm_medium=pypi"
urls.Homepage = "https://github.com/prettytable/prettytable"
urls.Source = "https://github.com/prettytable/prettytable"

[tool.ruff]
fix = true

lint.extend-select = [
  "C4",     # flake8-comprehensions
  "EM",     # flake8-errmsg
  "I",      # isort
  "ICN",    # flake8-import-conventions
  "ISC",    # flake8-implicit-str-concat
  "LOG",    # flake8-logging
  "PERF",   # Perflint
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PYI",    # flake8-pyi
  "RUF022", # unsorted-dunder-all
  "RUF100", # unused noqa (yesqa)
  "UP",     # pyupgrade
  "W",      # pycodestyle warnings
  "YTT",    # flake8-2020
]
lint.ignore = [
  "PIE790", # flake8-pie: unnecessary-placeholder
]
lint.flake8-import-conventions.aliases.datetime = "dt"
lint.flake8-import-conventions.banned-from = [ "datetime" ]
lint.isort.known-first-party = [ "prettytable" ]
lint.isort.required-imports = [ "from __future__ import annotations" ]

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.pytest.ini_options]
filterwarnings = [
  "error",
]
testpaths = [ "tests" ]

[tool.coverage.run]
omit = [
  "**/__main__.py",
]

[tool.mypy]
python_version = "3.10"
pretty = true
show_error_codes = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
warn_unreachable = true
strict_equality = true
enable_error_code = "ignore-without-code"

# Per-module options for third-party libraries without type stubs
[[tool.mypy.overrides]]
module = "wcwidth"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "colorama"
ignore_missing_imports = true
